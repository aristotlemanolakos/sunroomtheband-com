    <meta name="twitter:title" content="Sun Room — Tour &amp; Merch">
    <meta name="twitter:image" content="https://sunroomtheband.com/images/sunroom-share.png">
    <meta name="twitter:image:alt" content="The white Sun Room logo on a blue background.">
    <link rel="icon" href="images/sunroom-star.png" type="image/png" sizes="64x64">
    <link rel="icon" href="images/sunroom-star.svg" type="image/svg+xml" sizes="any">

  <body>
    <a class="skip-link" href="#tour">Skip to tour dates</a>
    <main>
      <section class="hero" id="top" aria-label="Sun Room">
        <picture class="hero-photo">
          <source media="(max-width: 600px)" srcset="images/sunroom-stage-900.webp">
          <img src="images/sunroom-stage.webp" alt="A musician crossing a sunlit stage beside a bass guitar and drum kit." width="1535" height="2316" fetchpriority="high">
        </picture>
        <div class="hero-shade" aria-hidden="true"></div>
        <header class="hero-header">
          <h1 class="brand"><a href="#top" aria-label="Sun Room home"><img src="images/sunroom-logo.png" width="1000" height="533" alt="Sun Room"></a></h1>
        </header>
        <nav class="hero-nav" aria-label="Main navigation">
          <a class="corner-link corner-tour" href="#tour">tour</a>
          <a class="corner-link corner-merch" href="https://merch.sunroomtheband.com/collections/all" target="_blank" rel="noopener noreferrer">merch<span class="sr-only"> (opens in a new tab)</span></a>
          <a class="corner-link corner-contact" href="#contact">contact</a>
        </nav>
      </section>

      <section class="tour-section" id="tour" aria-labelledby="tour-title">
        <div class="section-wrap">
          <div class="section-heading">
            <h2 id="tour-title">tour</h2>
          </div>
          <div class="tour-status" id="tour-status" role="status">
            <p id="tour-status-message">Loading shows…</p>
            <button id="tour-retry" type="button" hidden>Try again <span aria-hidden="true">↻</span></button>
            <a href="https://go.seated.com/notifications/welcome/1c296b62-808e-4308-9d64-caf638c93409" target="_blank" rel="noopener noreferrer">Get show alerts</a>
          </div>
          <div id="seated-55fdf2c0" data-artist-id="1c296b62-808e-4308-9d64-caf638c93409" data-css-version="2" aria-label="Upcoming Sun Room shows"></div>
          <noscript><p class="no-script">Enable JavaScript to load tour dates. <a href="https://go.seated.com/notifications/welcome/1c296b62-808e-4308-9d64-caf638c93409">Get show alerts from Sun Room</a>.</p></noscript>
        </div>
      </section>

      <section class="contact-section" id="contact" aria-labelledby="contact-title">
        <div class="section-wrap">
          <div class="section-heading"><h2 id="contact-title">contact</h2></div>
          <div class="contact-grid">
            <div class="contact-group">
              <h3>Management</h3>
              <address>
                <div class="contact-person"><p>Jack Gallagher</p><a href="mailto:jack@open-mgmt.com">jack@open-mgmt.com</a></div>
                <div class="contact-person"><p>Kamryn Kobal</p><a href="mailto:kamryn@open-mgmt.com">kamryn@open-mgmt.com</a></div>
              </address>
            </div>
            <div class="contact-group">
              <h3>Booking</h3>
              <address><div class="contact-person"><p>Michael Coughlin</p><a href="mailto:MCoughlin@wmeagency.com">MCoughlin@wmeagency.com</a></div></address>
            </div>
          </div>
          <footer class="site-footer">
            <a class="footer-brand" href="#top" aria-label="Sun Room home"><img src="images/sunroom-logo.png" alt="Sun Room" width="1000" height="533" loading="lazy"></a>
            <nav class="socials" aria-label="Follow Sun Room">
              <a href="https://www.instagram.com/sunroomband/" target="_blank" rel="noopener noreferrer">Instagram</a>
              <a href="https://www.tiktok.com/@sunroomband" target="_blank" rel="noopener noreferrer">TikTok</a>
              <a href="https://youtube.com/channel/UC_r-1VzvfoAcXMoTcPC7EJw" target="_blank" rel="noopener noreferrer">YouTube</a>
              <a href="https://twitter.com/sunroomband" target="_blank" rel="noopener noreferrer">Twitter</a>
            </nav>
            <p class="copyright">© <span id="current-year">2026</span> Sun Room</p>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
